id: server_health_report
namespace: demo.wearedevelopers

description: |
  Nightly infrastructure guardrail.

  Checks every server in the fleet against a CPU threshold, rolls the results up
  into one report, and pages the on-call engineer if any host is over budget.
  Uses core tasks only - no credentials, no network, no setup.

  Each host is sized like a real cloud instance: vCPU counts are powers of two
  (8, 16, 32, 64) and utilization is derived from cores in use over that maximum.

  At the default 90% threshold the whole fleet is healthy and the run is green.
  Re-run with the threshold at 80 to watch the guardrail catch web-02 and db-01.

labels:
  owner: platform-team
  demo: we-are-developers

inputs:
  - id: environment
    type: SELECT
    displayName: Environment
    defaults: prod
    values:
      - label: Production
        value: prod
      - label: Staging
        value: staging

  - id: cpu_threshold
    type: INT
    displayName: CPU alert threshold (%)
    defaults: 90

variables:
  # vcpus is the instance's maximum, always a power of two; used is cores in use.
  fleet:
    - {host: web-01, vcpus: 8,  used: 3}
    - {host: web-02, vcpus: 16, used: 13}
    - {host: api-01, vcpus: 32, used: 21}
    - {host: db-01,  vcpus: 64, used: 57}

tasks:
  - id: check_servers
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ vars.fleet }}"
    concurrencyLimit: 4
    fetchType: FETCH
    outputs:
      - id: status
        type: STRING
        value: "{{ outputs.evaluate.values.status }}"
      - id: line
        type: STRING
        value: "{{ outputs.evaluate.values.host }} using {{ outputs.evaluate.values.used }} of {{ outputs.evaluate.values.vcpus }} vCPU ({{ outputs.evaluate.values.utilization }}%) -> {{ outputs.evaluate.values.status }}"
    tasks:
      - id: evaluate
        type: io.kestra.plugin.core.output.OutputValues
        values:
          host: "{{ fromJson(item.value).host }}"
          vcpus: "{{ fromJson(item.value).vcpus }}"
          used: "{{ fromJson(item.value).used }}"
          # Multiply before dividing - Pebble does integer division.
          utilization: "{{ fromJson(item.value).used * 100 / fromJson(item.value).vcpus }}"
          status: "{{ (fromJson(item.value).used * 100 / fromJson(item.value).vcpus) > inputs.cpu_threshold ? 'BREACH' : 'OK' }}"

      - id: log_result
        type: io.kestra.plugin.core.log.Log
        message: "{{ outputs.evaluate.values.status }} - {{ outputs.evaluate.values.host }} using {{ outputs.evaluate.values.used }} of {{ outputs.evaluate.values.vcpus }} vCPU ({{ outputs.evaluate.values.utilization }}%)"

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ inputs.environment | upper }} fleet report - {{ outputs.check_servers.iterationCount }} servers checked against a {{ inputs.cpu_threshold }}% threshold.
      {% for line in loopOutputs(outputs.check_servers.outputs, 'line') %}  - {{ line }}
      {% endfor %}

  - id: guardrail
    type: io.kestra.plugin.core.flow.If
    condition: "{{ loopOutputs(outputs.check_servers.outputs, 'status') | jq('[.[] | select(. == \"BREACH\")] | length') | first > 0 }}"
    then:
      - id: raise_alert
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "CPU budget breached in {{ inputs.environment }} - page the on-call engineer."
    else:
      - id: all_clear
        type: io.kestra.plugin.core.log.Log
        message: "All servers within budget."
