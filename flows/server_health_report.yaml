id: server_health_report
namespace: demo.infra

description: |
  READ tool. Reports CPU utilization across the fleet against a threshold.

  Booth pair: ask this first, then ask for `restart_host` on whatever it flags.
  Fleet data is mocked - swap the loop source for your real inventory.

labels:
  domain: infra
  booth: read

inputs:
  - id: environment
    type: SELECT
    displayName: Environment
    description: Which environment's fleet to inspect. Defaults to prod.
    defaults: prod
    values:
      - label: Production
        value: prod
      - label: Staging
        value: staging

  - id: cpu_threshold
    type: INT
    displayName: CPU alert threshold (%)
    description: Utilization percentage above which a host is reported as a breach. Defaults to 80.
    defaults: 80

variables:
  # vcpus is the instance maximum, always a power of two; used is cores in use.
  fleet:
    - {host: web-01, vcpus: 8,  used: 3}
    - {host: web-02, vcpus: 16, used: 13}
    - {host: api-01, vcpus: 32, used: 21}
    - {host: db-01,  vcpus: 64, used: 57}

tasks:
  - id: check_servers
    type: io.kestra.plugin.core.flow.Loop
    values: "{{ vars.fleet }}"
    concurrencyLimit: 4
    fetchType: FETCH
    outputs:
      - id: status
        type: STRING
        value: "{{ outputs.evaluate.values.status }}"
      - id: line
        type: STRING
        value: "{{ outputs.evaluate.values.host }} using {{ outputs.evaluate.values.used }} of {{ outputs.evaluate.values.vcpus }} vCPU ({{ outputs.evaluate.values.utilization }}%) -> {{ outputs.evaluate.values.status }}"
    tasks:
      - id: evaluate
        type: io.kestra.plugin.core.output.OutputValues
        values:
          host: "{{ fromJson(item.value).host }}"
          vcpus: "{{ fromJson(item.value).vcpus }}"
          used: "{{ fromJson(item.value).used }}"
          # Multiply before dividing - Pebble does integer division.
          utilization: "{{ fromJson(item.value).used * 100 / fromJson(item.value).vcpus }}"
          status: "{{ (fromJson(item.value).used * 100 / fromJson(item.value).vcpus) > inputs.cpu_threshold ? 'BREACH' : 'OK' }}"

  - id: summarise
    type: io.kestra.plugin.core.output.OutputValues
    values:
      breaches: "{{ loopOutputs(outputs.check_servers.outputs, 'status') | jq('[.[] | select(. == \"BREACH\")] | length') | first }}"
      detail: |
        {% for line in loopOutputs(outputs.check_servers.outputs, 'line') %}- {{ line }}
        {% endfor %}

  - id: report
    type: io.kestra.plugin.core.log.Log
    message: |
      {{ inputs.environment | upper }} fleet - {{ outputs.check_servers.iterationCount }} hosts checked against {{ inputs.cpu_threshold }}%, {{ outputs.summarise.values.breaches }} over budget.
      {{ outputs.summarise.values.detail }}

outputs:
  - id: summary
    type: STRING
    displayName: Summary
    value: "{{ inputs.environment | upper }} fleet: {{ outputs.check_servers.iterationCount }} hosts checked against a {{ inputs.cpu_threshold }}% CPU threshold, {{ outputs.summarise.values.breaches }} over budget."

  - id: hosts
    type: STRING
    displayName: Per-host detail
    value: "{{ outputs.summarise.values.detail }}"

  - id: breach_count
    type: INT
    displayName: Hosts over threshold
    value: "{{ outputs.summarise.values.breaches }}"

triggers:
  - id: mcp
    type: io.kestra.plugin.core.trigger.McpToolTrigger
    toolName: get_server_health
    title: Server health report
    toolDescription: >-
      Reports CPU utilization for every host in the fleet and flags any host over
      a threshold. Read-only - it inspects but never changes anything. Call this
      when asked how the servers, hosts or fleet are doing, or which machines are
      running hot. To actually restart a host afterwards, use restart_host.
    annotations:
      readOnly: true
      destructive: false
      idempotent: true
